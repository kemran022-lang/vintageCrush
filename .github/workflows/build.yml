name: Build Vintage Crush
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
    
      - name: Configure
        run: cmake -S . -B build -A x64
      - name: Build VST3
        run: cmake --build build --config Release --target VintageCrush_VST3
      - name: Package plugin
        shell: pwsh
        run: |
          $p = Get-ChildItem -Path build -Directory -Recurse | Where-Object { $_.Name -eq 'Vintage Crush.vst3' } | Select-Object -First 1
          if (-not $p) { throw 'VST3 bundle not found after build.' }
          Compress-Archive -Path $p.FullName -DestinationPath VintageCrush-Windows-VST3.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: VintageCrush-Windows-VST3
          path: VintageCrush-Windows-VST3.zip
          if-no-files-found: error
